name: Validate source and runtime (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-contract:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Runtime contract, rollback and cross-process maintenance
        run: node --test --test-concurrency=2 runtime/lean-runtime/declared-checks.test.mjs runtime/lean-runtime/work-context.test.mjs runtime/core-maintenance/bounded-read.test.mjs runtime/lean-runtime/cold-recovery.test.mjs runtime/lean-runtime/turn-reconnect.test.mjs runtime/pc2-sync/paths.test.mjs runtime/lean-runtime/dispatch-reconciliation.test.mjs runtime/lean-runtime/preflight-freshness.test.mjs runtime/lean-runtime/backend-orphan.test.mjs runtime/lean-runtime/inflight-recovery.test.mjs runtime/lean-runtime/stopped-reconciliation.test.mjs runtime/lean-runtime/tool-evidence.test.mjs runtime/lean-runtime/context-paths.test.mjs runtime/lean-runtime/codebase-context.test.mjs runtime/lean-runtime/model-routing.test.mjs runtime/lean-runtime/model-observation.test.mjs runtime/core-maintenance/summary-handoff.test.mjs runtime/lean-runtime/runtime-contract.test.mjs runtime/lean-runtime/update-safety.test.mjs runtime/lean-runtime/reliability.test.mjs runtime/headless/audit-retention.test.mjs runtime/core-maintenance/core-patch.test.mjs runtime/core-maintenance/audit-diagnostics.test.mjs runtime/core-maintenance/audit-update.test.mjs runtime/core-maintenance/tool-annotations.test.mjs runtime/core-maintenance/audit-protocol.test.mjs runtime/rebuild-contract.test.mjs
      - name: Windows PowerShell 5.1 runtime health and offline updater
        shell: powershell
        run: .\tests\validate-runtime-health.ps1

  windows-syntax:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 syntax and dry-run
        shell: powershell
        run: .\tests\validate.ps1
